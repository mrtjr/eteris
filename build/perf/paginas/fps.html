<!doctype html><html><head><meta charset="utf-8"><title>fps</title><script src="m.js"></script>
<style>body{margin:0;background:#111;overflow:hidden}.b{position:absolute;width:80px;height:80px;border-radius:12px;background:linear-gradient(45deg,#4af,#f4a)}</style></head><body>
<script>
var boxes=[];for(var i=0;i<40;i++){var d=document.createElement('div');d.className='b';document.body.appendChild(d);boxes.push(d);}
function step(t){var w=innerWidth-80,h=innerHeight-80;for(var i=0;i<boxes.length;i++){var a=t/1000*(0.5+i*0.05)+i;boxes[i].style.transform='translate('+((Math.sin(a)+1)/2*w)+'px,'+((Math.cos(a*1.3)+1)/2*h)+'px) rotate('+(a*57)+'deg)';}requestAnimationFrame(step);}
requestAnimationFrame(step);fpsMeter('anim');
</script></body></html>
