<!doctype html><html lang="pt"><head><meta charset="utf-8"><title>ocl</title><script src="m.js"></script>
<style>body{margin:0;background:#111;overflow:hidden}.b{position:absolute;width:120px;height:120px;border-radius:16px;background:linear-gradient(45deg,#4af,#f4a)}</style></head><body>
<div class="b" id="b"></div>
<script>
// B-OCL (D4): a página continua a desenhar quando a janela não aparece (minimizada, coberta, outra área de trabalho,
// sessão bloqueada)? Sinais: «vis» a cada mudança de document.visibilityState (v=1 visível, v=0 escondida) e os fps
// por segundo (rAF; param quando o Chromium dá a página por escondida).
var b = document.getElementById('b');
function step(t) { var a = t / 1000; b.style.transform = 'translate(' + (200 + 150 * Math.sin(a)) + 'px,' + (200 + 150 * Math.cos(a * 1.3)) + 'px) rotate(' + (a * 90) + 'deg)'; requestAnimationFrame(step); }
requestAnimationFrame(step); fpsMeter('ocl');
beacon('vis', document.visibilityState === 'visible' ? 1 : 0);
document.addEventListener('visibilitychange', function () { beacon('vis', document.visibilityState === 'visible' ? 1 : 0); });
</script></body></html>
