<!doctype html><html lang="pt"><head><meta charset="utf-8"><title>links</title><script src="m.js"></script>
<style>body{margin:0;font:15px/1.5 sans-serif;columns:4;column-gap:24px;padding:16px}a{display:block;color:#0645ad}</style></head><body>
<script>
// ~2000 links densos (como uma página de índice): rolar com a roda do rato com o cursor parado põe um link novo debaixo
// do cursor a cada passo (E5: a bolha do endereço do link na camada; contador camada.mostrar/esconder).
var html = '';
for (var i = 0; i < 2000; i++) html += '<a href="http://127.0.0.1:9/ligacao-' + i + '">Ligação de teste número ' + i + '</a>';
document.write(html);
requestAnimationFrame(function () { requestAnimationFrame(function () { beacon('painted', Math.round(performance.now())); }); });
fpsMeter('links');
</script></body></html>
