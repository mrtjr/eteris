<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="color-scheme" content="dark">
<title>Promessas de privacidade</title>
<style>
  :root {
    --bg: #0b0d13; --text: #e9ebf2; --muted: #a3a9b8; --faint: #5e6577;
    --line: rgba(255, 255, 255, .08); --card: rgba(255, 255, 255, .03);
    --iris: linear-gradient(90deg, #8b5cf6, #22d3ee, #34d399, #f472b6);
    /* Os dois primeiros tons da Cor do Éteris (o servidor redefine-os com a cor escolhida, ver InternalPages) */
    --accent: #8b5cf6; --accent-2: #22d3ee;
    --ok: #34d399; --bad: #fb7185; --off: #868da0;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .glow { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(40vmax 30vmax at 0% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
                radial-gradient(40vmax 30vmax at 100% 100%, rgba(52, 211, 153, .1), transparent 70%); }
  main { position: relative; width: min(760px, 92vw); margin: 0 auto; padding: 48px 0 90px; }
  h1 { font-size: 30px; font-weight: 300; margin-bottom: 8px; }
  h1 b { font-weight: 600; background: var(--iris); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 22px; }
  .score { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; font-size: 14px; color: var(--muted); }
  .score strong { font-size: 22px; color: var(--text); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .row { display: flex; gap: 16px; padding: 16px 20px; align-items: flex-start; }
  .row + .row { border-top: 1px solid var(--line); }
  .mark { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; margin-top: 1px; }
  .mark.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .mark.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .mark.off { background: rgba(255, 255, 255, .06); color: var(--off); }
  .row .text { flex: 1; min-width: 0; }
  .row b { display: block; font-weight: 500; font-size: 14.5px; margin-bottom: 3px; }
  .row span { color: var(--muted); font-size: 12.8px; line-height: 1.45; }
  .row .live { display: block; margin-top: 4px; font-size: 12px; color: var(--faint); }
  .row a { color: #67e8f9; text-decoration: none; font-size: 13px; white-space: nowrap; align-self: center; }
  .row a:hover { text-decoration: underline; }
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; color: var(--faint); font-size: 12.5px; }
  button { font: inherit; font-size: 13px; color: var(--text); cursor: pointer; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); }
  button:hover { background: rgba(255, 255, 255, .1); }

  /* Tema claro (o servidor acrescenta class="light" ao <html>) */
  html.light { --bg: #f3f4f9; --text: #1b1f2a; --muted: #535b6e; --faint: #868da0; --line: rgba(20, 24, 40, .1); --card: rgba(255, 255, 255, .8); --ok: #059669; --bad: #e11d48; }
  html.light .mark.off { background: rgba(20, 24, 40, .06); }
  html.light .row a { color: #0e7490; }
  html.light button { background: #fff; }
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <h1><b>Promessas</b> de privacidade</h1>
  <p class="lead">O que o Éteris garante, verificado agora no estado real do motor e desta página — não é uma lista escrita
    à mão. Uma promessa por cumprir aparece com ✘.</p>
  <div class="score" id="score"></div>
  <div class="card" id="list" role="list"></div>
  <footer><span id="when"></span><button id="again">Verificar de novo</button></footer>
</main>
<script type="application/json" id="data">{{DATA}}</script>
<script>
  const data = JSON.parse(document.getElementById('data').textContent);
  // Verificações feitas aqui mesmo, pelo JavaScript da página (o mesmo que um site veria).
  const live = {
    gpc: () => navigator.globalPrivacyControl === true
      ? 'Confirmado nesta página: navigator.globalPrivacyControl === true'
      : null,
    language: () => navigator.languages.length === 1
      ? 'Confirmado nesta página: navigator.languages = [' + navigator.languages.join(', ') + ']'
      : null,
    ads: () => !('browsingTopics' in document) && !('joinAdInterestGroup' in navigator) && !('runAdAuction' in navigator)
      && !('sharedStorage' in window) && typeof window.HTMLFencedFrameElement === 'undefined'
      ? 'Confirmado nesta página: document.browsingTopics, navigator.joinAdInterestGroup, window.sharedStorage e <fencedframe> não existem'
      : null,
  };
  const list = document.getElementById('list');
  let kept = 0, broken = 0, optional = 0;
  for (const p of data.promises) {
    let state = p.kept;
    let note = '';
    if (p.live && live[p.live]) {
      const seen = live[p.live]();
      if (seen) note = seen;
      else { state = false; note = 'A verificação ao vivo nesta página falhou.'; }
    }
    if (state === true) kept++; else if (state === false) broken++; else optional++;
    const row = document.createElement('div'); row.className = 'row'; row.setAttribute('role', 'listitem'); row.dataset.id = p.id;
    const mark = document.createElement('div');
    mark.className = 'mark ' + (state === true ? 'ok' : state === false ? 'bad' : 'off');
    mark.textContent = state === true ? '✔' : state === false ? '✘' : '○';
    mark.setAttribute('aria-label', state === true ? 'Cumprida' : state === false ? 'Por cumprir' : 'Opcional, desligada');
    const text = document.createElement('div'); text.className = 'text';
    const b = document.createElement('b'); b.textContent = p.title;
    const span = document.createElement('span'); span.textContent = p.detail;
    text.append(b, span);
    if (note) { const small = document.createElement('span'); small.className = 'live'; small.textContent = note; text.append(small); }
    row.append(mark, text);
    if (p.fix) { const a = document.createElement('a'); a.href = p.fix; a.textContent = state === null ? 'Ligar →' : 'Definições →'; row.append(a); }
    list.append(row);
  }
  const score = document.getElementById('score');
  const strong = document.createElement('strong'); strong.textContent = kept + ' de ' + (kept + broken);
  const tail = document.createElement('span');
  tail.textContent = 'promessas cumpridas' + (optional ? ' · ' + optional + ' opcional(is) desligada(s)' : '');
  score.append(strong, tail);
  document.getElementById('when').textContent = 'Verificado às ' + new Date().toLocaleTimeString('pt-PT');
  document.getElementById('again').addEventListener('click', () => location.reload());
</script>
</body>
</html>
