<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src eteris:">
<meta name="color-scheme" content="dark">
<title>Histórico</title>
<style>
  :root {
    --bg: #0b0d13; --text: #e9ebf2; --muted: #a3a9b8; --faint: #5e6577;
    --glass: rgba(22, 25, 35, .72); --line: rgba(255, 255, 255, .08); --row: rgba(255, 255, 255, .04);
    --iris: linear-gradient(90deg, #8b5cf6, #22d3ee, #34d399, #f472b6);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  .glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(40vmax 30vmax at 10% -10%, rgba(139, 92, 246, .22), transparent 70%),
      radial-gradient(40vmax 30vmax at 95% 0%, rgba(34, 211, 238, .14), transparent 70%);
  }
  header {
    position: sticky; top: 0; z-index: 5; backdrop-filter: blur(24px);
    background: linear-gradient(rgba(11, 13, 19, .92), rgba(11, 13, 19, .75));
    border-bottom: 1px solid var(--line);
  }
  .bar { width: min(860px, 92vw); margin: 0 auto; padding: 28px 0 18px; display: flex; align-items: center; gap: 18px; }
  h1 { font-size: 30px; font-weight: 300; letter-spacing: -.02em; }
  h1 b { font-weight: 600; background: var(--iris); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .count { color: var(--faint); font-size: 13px; margin-top: 6px; }
  .search { flex: 1; position: relative; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); }
  input {
    width: 100%; height: 42px; border-radius: 21px; padding: 0 16px 0 42px;
    font: inherit; font-size: 14.5px; color: var(--text); outline: none;
    border: 1.5px solid var(--line); background: var(--glass); transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: var(--faint); }
  input:focus {
    border-color: transparent;
    background: linear-gradient(#161923, #161923) padding-box, var(--iris) border-box;
    box-shadow: 0 6px 30px rgba(139, 92, 246, .22);
  }
  .clear { position: relative; }
  button {
    font: inherit; font-size: 13.5px; color: var(--text); cursor: pointer;
    height: 42px; padding: 0 18px; border-radius: 21px; border: 1px solid var(--line); background: var(--row);
    transition: background .15s;
  }
  button:hover { background: rgba(255, 255, 255, .09); }
  .menu {
    position: absolute; right: 0; top: 50px; min-width: 210px; padding: 6px; display: none;
    background: #1b1e2a; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  }
  .menu.open { display: block; animation: pop .14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
  .menu a {
    display: block; padding: 10px 14px; border-radius: 9px; color: var(--text); text-decoration: none; font-size: 13.5px;
  }
  .menu a:hover { background: rgba(255, 255, 255, .07); }
  .menu a.danger { color: #ff8fa3; }
  main { position: relative; z-index: 1; width: min(860px, 92vw); margin: 0 auto; padding: 10px 0 80px; }
  section { margin-top: 22px; }
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 8px 14px;
  }
  h2::first-letter { text-transform: uppercase; }
  .card { background: rgba(255, 255, 255, .025); border: 1px solid var(--line); border-radius: 18px; padding: 6px; }
  .row {
    display: grid; grid-template-columns: 52px 28px 1fr auto 34px; align-items: center; gap: 12px;
    padding: 7px 8px 7px 14px; border-radius: 12px; text-decoration: none; color: var(--text);
    transition: background .12s, opacity .25s, transform .25s;
  }
  .row:hover { background: var(--row); }
  .row.gone { opacity: 0; transform: translateX(24px); }
  .time { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .badge {
    width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    font-size: 12.5px; font-weight: 700; color: #0b0d13;
  }
  .title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .host { color: var(--faint); font-size: 12.5px; white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .del {
    width: 30px; height: 30px; padding: 0; border: 0; border-radius: 15px; background: transparent;
    color: var(--muted); font-size: 16px; line-height: 30px; opacity: 0;
  }
  .row:hover .del { opacity: 1; }
  .del:hover { background: rgba(255, 122, 144, .16); color: #ff8fa3; }
  mark { background: rgba(34, 211, 238, .22); color: inherit; border-radius: 3px; }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty .orb {
    width: 84px; height: 84px; margin: 0 auto 22px; border-radius: 50%; background: var(--iris); opacity: .85;
    filter: blur(1px); box-shadow: 0 0 60px rgba(139, 92, 246, .45);
  }
  .empty h3 { font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  iframe { display: none; }
</style>
</head>
<body>
<div class="glow"></div>
<header>
  <div class="bar">
    <div>
      <h1><b>Histórico</b></h1>
      <div class="count" id="count"></div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Pesquisar no histórico   ( / )" autocomplete="off" spellcheck="false">
    </div>
    <div class="clear">
      <button id="clearBtn">Limpar…</button>
      <div class="menu" id="menu">
        <a href="#" data-range="hour">Última hora</a>
        <a href="#" data-range="today">Hoje</a>
        <a href="#" data-range="all" class="danger">Todo o histórico</a>
      </div>
    </div>
  </div>
</header>
<main id="list"></main>
<iframe id="sink" title=""></iframe>
<script type="application/json" id="data">{{DATA}}</script>
<script>
  const data = JSON.parse(document.getElementById('data').textContent);
  const list = document.getElementById('list');
  const q = document.getElementById('q');
  const count = document.getElementById('count');
  history.replaceState(null, '', 'eteris://history/');

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function highlight(node, text, term) {
    node.textContent = '';
    if (!term) { node.textContent = text; return; }
    const i = text.toLowerCase().indexOf(term);
    if (i < 0) { node.textContent = text; return; }
    node.append(text.slice(0, i), el('mark', null, text.slice(i, i + term.length)), text.slice(i + term.length));
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    list.textContent = '';
    let shown = 0;
    for (const group of data.groups) {
      const items = group.items.filter(it => !term || it.title.toLowerCase().includes(term) || it.url.toLowerCase().includes(term));
      if (!items.length) continue;
      const section = el('section');
      section.append(el('h2', null, group.label));
      const card = el('div', 'card');
      for (const it of items) {
        const row = el('a', 'row'); row.href = it.url; row.title = it.url;
        const badge = el('span', 'badge', it.letter); badge.style.background = it.color;
        const title = el('span', 'title'); highlight(title, it.title, term);
        const host = el('span', 'host'); highlight(host, it.host, term);
        const del = el('button', 'del', '×'); del.title = 'Remover do histórico';
        del.addEventListener('click', e => {
          e.preventDefault(); e.stopPropagation();
          document.getElementById('sink').src = `eteris://history/delete?id=${it.id}&t=${data.token}&n=${Date.now()}`;
          row.classList.add('gone');
          setTimeout(() => {
            group.items = group.items.filter(x => x !== it);
            data.total--;
            render();
          }, 250);
        });
        row.append(el('span', 'time', it.time), badge, title, host, del);
        card.append(row);
        shown++;
      }
      section.append(card);
      list.append(section);
    }
    count.textContent = term
      ? `${shown} ${shown === 1 ? 'resultado' : 'resultados'}`
      : `${data.total} ${data.total === 1 ? 'visita' : 'visitas'}`;
    if (!shown) {
      const empty = el('div', 'empty');
      empty.append(el('div', 'orb'), el('h3', null, term ? 'Nada encontrado' : 'O histórico está vazio'),
        el('p', null, term ? 'Experimente outras palavras.' : 'As páginas que visitar aparecem aqui. As janelas privadas nunca ficam registadas.'));
      list.append(empty);
    }
  }

  q.addEventListener('input', render);
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape') { q.value = ''; render(); menu.classList.remove('open'); }
  });

  const menu = document.getElementById('menu');
  document.getElementById('clearBtn').addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('click', () => menu.classList.remove('open'));
  menu.addEventListener('click', e => {
    const range = e.target.dataset && e.target.dataset.range;
    if (!range) return;
    e.preventDefault();
    if (range === 'all' && !e.target.dataset.armed) {
      e.stopPropagation();
      e.target.dataset.armed = '1';
      e.target.textContent = 'Clique de novo para apagar tudo';
      return;
    }
    location.href = `eteris://history/clear?range=${range}&t=${data.token}`;
  });

  render();
</script>
</body>
</html>
