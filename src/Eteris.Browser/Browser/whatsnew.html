<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="color-scheme" content="dark">
<title>Novidades do Éteris</title>
<style>
  :root {
    --bg: #0b0d13; --text: #e9ebf2; --muted: #a3a9b8; --faint: #5e6577;
    --line: rgba(255, 255, 255, .08); --card: rgba(255, 255, 255, .035);
    --iris: linear-gradient(90deg, #8b5cf6, #22d3ee, #34d399, #f472b6);
  }
  html.light { --bg: #f3f4f9; --text: #1b1f2a; --muted: #535b6e; --faint: #868da0; --line: rgba(20, 24, 40, .1); --card: rgba(255, 255, 255, .8); }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .glow { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(45vmax 35vmax at 15% -10%, rgba(139, 92, 246, .25), transparent 70%),
                radial-gradient(40vmax 30vmax at 100% 10%, rgba(34, 211, 238, .14), transparent 70%); }
  main { position: relative; width: min(940px, 92vw); margin: 0 auto; padding: 8vh 0 90px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #0b0d13;
         padding: 5px 12px; border-radius: 999px; background: var(--iris); }
  h1 { font-size: clamp(34px, 5vw, 50px); font-weight: 300; letter-spacing: -.02em; margin: 18px 0 10px; }
  h1 b { font-weight: 650; background: var(--iris); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { color: var(--muted); font-size: 17px; max-width: 640px; line-height: 1.5; margin-bottom: 38px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .item { display: flex; gap: 16px; padding: 20px; border-radius: 20px; background: var(--card); border: 1px solid var(--line);
          backdrop-filter: blur(16px); animation: rise .6s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .icon { width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
          background: linear-gradient(135deg, rgba(139, 92, 246, .22), rgba(34, 211, 238, .18)); }
  .item h3 { font-size: 15.5px; font-weight: 600; margin-bottom: 5px; }
  .item p { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  kbd { display: inline-block; margin-top: 8px; font: 600 11.5px "Segoe UI", sans-serif; padding: 3px 8px; border-radius: 7px;
        color: var(--text); background: rgba(127, 127, 140, .14); border-bottom: 2px solid rgba(127, 127, 140, .3); }
  .foot { margin-top: 34px; color: var(--faint); font-size: 13px; }
  .older { grid-column: 1 / -1; margin: 18px 0 0; color: var(--faint); font-size: 13px; font-weight: 600; }
  .foot a { color: #67e8f9; text-decoration: none; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <span class="tag" id="tag"></span>
  <h1>O que há de novo no <b>Éteris</b></h1>
  <p class="lead">Dezenas de melhorias para navegar com mais privacidade e menos fricção. Os destaques:</p>
  <div class="grid" id="grid"></div>
  <p class="foot">Tudo se pode ajustar em <a href="eteris://settings/">Definições</a> · todos os atalhos com F1.</p>
</main>
<script type="application/json" id="data">{{DATA}}</script>
<script>
  const data = JSON.parse(document.getElementById('data').textContent);
  document.getElementById('tag').textContent = 'Versão ' + data.version;
  const grid = document.getElementById('grid');
  data.items.forEach((h, i) => {
    if (i === data.older && data.older > 0 && data.older < data.items.length) {
      const sep = document.createElement('h2'); sep.className = 'older'; sep.textContent = 'Versões anteriores';
      grid.append(sep);
    }
    const item = document.createElement('div'); item.className = 'item'; item.style.animationDelay = (i * 0.05) + 's';
    const icon = document.createElement('div'); icon.className = 'icon'; icon.textContent = h.icon;
    const body = document.createElement('div');
    const t = document.createElement('h3'); t.textContent = h.title;
    const p = document.createElement('p'); p.textContent = h.detail;
    body.append(t, p);
    if (h.keys) { const k = document.createElement('kbd'); k.textContent = h.keys; body.append(k); }
    item.append(icon, body);
    grid.append(item);
  });
</script>
</body>
</html>
