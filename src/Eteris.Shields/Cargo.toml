[package]
name = "eteris_shields"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Sem "single-thread": o CEF consulta o motor a partir de várias threads de rede.
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde_json = "1.0.154"
# A Public Suffix List (secções ICANN e PRIVATE; dados MPL-2.0), já trazida pelo adblock: o «site» (eTLD+1) do Éteris.
psl = "2.1.247"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
