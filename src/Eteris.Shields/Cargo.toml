[package]
name = "eteris_shields"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Sem "single-thread": o CEF consulta o motor a partir de várias threads de rede.
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
