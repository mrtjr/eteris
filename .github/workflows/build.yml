name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    # Hoje leva 4 a 5 min: um bloqueio não pode comer as 6 h por omissão.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Escudo (Rust) — testes, incluindo as listas reais
        run: cargo test --release --manifest-path src/Eteris.Shields/Cargo.toml
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # Um teste preso deixa um dump (5 min); o TRX guarda a duração de cada teste; se falhar, os resultados ficam no job.
      - run: dotnet test -c Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type mini --logger "trx;LogFileName=testes.trx" --results-directory TestResults
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testes-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
