name: release

# As releases normais NÃO são publicadas por este fluxo: publicam-se localmente, na máquina do dono, com o motor
# próprio compilado em build/cef-codecs (codecs da plataforma: H.264/HEVC pela placa gráfica, AAC pelo Media
# Foundation). Ver docs/motor.md, «Publicação». Os runners alojados do GitHub não conseguem compilar esse motor
# (110–150 GB, 5–10 h): uma publicação daqui sai com o runtime da CEF do NuGet, SEM codecs, e os utilizadores
# atualizados pelo Velopack voltariam a um motor sem H.264/AAC.
#
# - push de uma tag v*: só verificação (compilar e correr os testes), sem pack nem upload;
# - workflow_dispatch com «sem_codecs» = true: publicação de emergência pelo CI, sem codecs (o Éteris recorre ao motor
#   de vídeo do WebView2 para H.264/AAC, como antes da 0.2.9). Sem «sem_codecs» = true nada é publicado.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (por exemplo v0.2.10); tem de existir no repositório"
        required: true
        type: string
      sem_codecs:
        description: "Emergência: publicar SEM codecs, com o runtime da CEF do NuGet (as releases normais são locais, ver docs/motor.md)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: windows-latest
    # Hoje leva 4 a 5 min: um bloqueio não pode comer as 6 h por omissão.
    timeout-minutes: 30
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      # Não se pode chamar VERSION: o MSBuild lê variáveis de ambiente como propriedades, e Version=v0.2.0
      # (com o «v») não é uma versão NuGet válida — o restauro do projeto de testes falhava sem mensagem.
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Os testes dos scripts injetados correm no Node e falham sem ele (a versão da máquina de publicação).
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: O feed de updates do cliente tem de apontar para este repositório
        run: |
          $expected = '"' + $env:REPO_URL + '"'
          if (-not (Select-String -Path src/Eteris.Browser/Updates/UpdateService.cs -Pattern $expected -SimpleMatch)) {
            throw "UpdateService.RepoUrl nao corresponde a $env:REPO_URL"
          }
      - run: cargo test --release --locked --manifest-path src/Eteris.Shields/Cargo.toml
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # Um teste preso deixa um dump (5 min); o TRX guarda a duração de cada teste; os resultados ficam sempre no job
      # (numa execução verde, a duração de cada teste).
      - run: dotnet test -c Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type mini --logger "trx;LogFileName=testes.trx" --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
      - name: Só verificação — esta tag publica-se localmente com o motor próprio
        run: Write-Host "Tag $env:RELEASE_TAG verificada. Sem pack nem upload; a release publica-se localmente com build/cef-codecs (docs/motor.md, Publicacao)."

  publish-sem-codecs:
    if: github.event_name == 'workflow_dispatch' && inputs.sem_codecs == true
    runs-on: windows-latest
    # Compila o Rust, publica, empacota e envia: prazo maior, mas com prazo.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SEM_CODECS: ${{ inputs.sem_codecs }}
    steps:
      - name: Confirmação explícita de publicação sem codecs
        run: |
          if ($env:SEM_CODECS -ne "true") { throw "Publicacao pelo CI so com sem_codecs = true (as releases normais sao locais: docs/motor.md)" }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag invalida: $env:RELEASE_TAG (esperado vX.Y.Z)" }
          Write-Host "::warning::Publicacao de emergencia SEM codecs ($env:RELEASE_TAG): runtime da CEF do NuGet."
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      # O setup-dotnet lê o global.json da árvore da tag, e as tags até à v0.2.16 não o têm: pára aqui com o que fazer.
      - name: A tag tem de ter global.json
        run: |
          if (-not (Test-Path global.json)) { throw "A tag $env:RELEASE_TAG nao tem global.json (as tags ate a v0.2.16 nao o tem): publicar a partir de uma tag que o tenha" }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Os testes dos scripts injetados correm no Node e falham sem ele (a versão da máquina de publicação).
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: O feed de updates do cliente tem de apontar para este repositório
        run: |
          $expected = '"' + $env:REPO_URL + '"'
          if (-not (Select-String -Path src/Eteris.Browser/Updates/UpdateService.cs -Pattern $expected -SimpleMatch)) {
            throw "UpdateService.RepoUrl nao corresponde a $env:REPO_URL"
          }
      - run: cargo test --release --locked --manifest-path src/Eteris.Shields/Cargo.toml
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # Os mesmos testes, com as mesmas opções, do job verify.
      - run: dotnet test -c Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type mini --logger "trx;LogFileName=testes.trx" --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
      # Sem o motor próprio nem o CefSharp com o patch do sandbox (build/sandbox/build-all.ps1): publica sem sandbox.
      - name: O instalador tem de levar o motor do escudo
        run: |
          .\build\publish.ps1 -Version $env:RELEASE_TAG.TrimStart("v") -NoSandbox
          if (-not (Test-Path publish/eteris_shields.dll)) { throw "eteris_shields.dll em falta no publish" }
          if ((Get-ChildItem publish/Shields/lists/*.txt).Count -lt 10) { throw "listas de filtros em falta no publish" }
          if (-not (Test-Path publish/Shields/resources/scriptlets.json)) { throw "scriptlets.json em falta no publish" }
      - run: dotnet tool install -g vpk
      - name: Descarregar releases anteriores para gerar pacotes delta
        run: vpk download github --repoUrl $env:REPO_URL --token "${{ secrets.GITHUB_TOKEN }}" --outputDir Releases
        continue-on-error: true
      # O CI também não tem o google-oauth.json (nunca no repositório): sai sem login Google, e o pack.ps1 só o aceita a pedido.
      - run: .\build\pack.ps1 -Version $env:RELEASE_TAG.TrimStart("v") -NoSandbox -SemLogin
      # Rascunho: quem publica é o build/release.ps1, com a chave que o CI não tem
      - run: vpk upload github --repoUrl $env:REPO_URL --releaseName "Éteris $env:RELEASE_TAG (sem codecs)" --tag $env:RELEASE_TAG --token "${{ secrets.GITHUB_TOKEN }}" --outputDir Releases
