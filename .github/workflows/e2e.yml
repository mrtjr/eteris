name: e2e

# Testes que arrancam o Éteris compilado (tests/Eteris.Browser.E2E.Tests, fora da solução): um perfil temporário e o
# DevTools do motor em 127.0.0.1. Os resultados guardam-se sempre, também quando passam.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Eteris.Browser -c Release
      - run: dotnet test tests/Eteris.Browser.E2E.Tests -c Release --blame-hang-timeout 5m --blame-hang-dump-type mini --logger "trx;LogFileName=e2e.trx" --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
